<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#246b4a"><title>食費ログ</title>
<style>
:root{--green:#246b4a;--pale:#e8f4ec;--ink:#203128;--muted:#68766e;--line:#dce6df;--bg:#f5f8f5;--orange:#b96512}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:16px}header{background:var(--green);color:white;padding:22px 18px 24px;border-radius:0 0 24px 24px}header h1{margin:0 0 5px;font-size:25px}header p{margin:0;opacity:.9;font-size:13px}.wrap{max-width:650px;margin:auto;padding:14px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #173e2510}.eyebrow{font-size:13px;color:var(--muted)}.big{font-size:30px;font-weight:800;margin:4px 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:9px;background:#e8eee9;border-radius:20px;overflow:hidden;margin:12px 0 7px}.bar{height:100%;width:0;background:var(--green);border-radius:20px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--pale);border-radius:13px;padding:12px}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat strong{font-size:20px}.tabs{display:flex;gap:7px;margin:12px 0;overflow:auto}.tabs button{white-space:nowrap;flex:1;padding:11px 9px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-weight:700}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}h2{font-size:18px;margin:0 0 13px}label{display:block;font-size:14px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cbd8ce;border-radius:10px;background:white;color:var(--ink)}textarea{min-height:70px;resize:vertical}.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}.twocol input{min-width:0;width:100%}input[type="date"]{height:48px!important;min-height:48px!important;max-height:48px!important;box-sizing:border-box;padding:8px 6px;font-size:15px;line-height:1.2;min-width:0;max-width:100%;width:100%;display:block;align-self:start;-webkit-appearance:none;appearance:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.radioChoices{display:flex;gap:8px;flex-wrap:wrap}.radioChoice{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;font-size:14px;font-weight:500;flex:1;min-width:95px}.radioChoice input{width:auto;margin:0;accent-color:var(--green)}.choice{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:500;margin:0}.choice input{width:auto;margin:0;accent-color:var(--green)}.primary,.secondary,.danger{border:0;border-radius:11px;padding:13px 15px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--green);color:white;width:100%;margin-top:15px}.secondary{background:var(--pale);color:var(--green)}.danger{background:#fff0ee;color:#a22}.entry{border-bottom:1px solid var(--line);padding:12px 0}.entry:last-child{border-bottom:0}.entry strong{font-size:16px}.entry small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.entry .actions{display:flex;gap:7px;margin-top:8px}.entry .actions button{padding:6px 10px;font-size:13px}.hidden{display:none!important}.hint{font-size:13px;color:var(--muted);line-height:1.6}.advice{background:#fff8e9;border:1px solid #f0dfb9;padding:13px;border-radius:12px;line-height:1.65}.empty{padding:18px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 28px}
</style></head><body><header><h1>🍚 食費ログ</h1><p>食費を見える化して、無理なく節約しよう</p></header><main class="wrap">
<section id="record" class="panel card"><h2 id="formTitle">📝 食費を記録</h2><form id="entryForm"><input type="hidden" id="editId"><div class="twocol"><div><label for="date">日付</label><input type="date" id="date" required></div><div><label for="amount">金額（円）</label><input type="number" id="amount" min="1" step="1" placeholder="例：1280" required></div></div><label>食事</label><div class="radioChoices" id="mealChoices"><label class="radioChoice"><input type="radio" name="meal" value="朝食" required><span>朝食</span></label><label class="radioChoice"><input type="radio" name="meal" value="昼食"><span>昼食</span></label><label class="radioChoice"><input type="radio" name="meal" value="夕食"><span>夕食</span></label></div><label>薬を飲んだか</label><div class="radioChoices" id="medicationChoices"><label class="radioChoice"><input type="radio" name="medication" value="飲んだ" required><span>飲んだ</span></label><label class="radioChoice"><input type="radio" name="medication" value="飲んでない"><span>飲んでない</span></label><label class="radioChoice"><input type="radio" name="medication" value="未記録"><span>未記録</span></label></div><label for="content">内容（任意）</label><input id="content" maxlength="100" placeholder="例：弁当、パン、コーヒー"><label>食費が増えた理由（複数選択可）</label><div class="choices" id="reasonChoices"></div><label for="memo">ひとことメモ（任意）</label><textarea id="memo" placeholder="お腹が空いていた、疲れていた、など"></textarea><button class="primary" type="submit" id="saveBtn">記録を保存</button><button type="button" class="secondary hidden" id="cancelEdit" style="width:100%;margin-top:8px">編集をキャンセル</button></form><p class="hint">記録はこのブラウザ内に保存されます。定期的に「設定・保存」からバックアップしてください。</p></section>
<section class="card"><div class="row"><span class="eyebrow" id="monthLabel">今月の食費</span><button class="secondary" id="budgetBtn">予算変更</button></div><div class="big" id="total">¥0</div><div class="row"><span class="eyebrow" id="budgetText">予算 ¥90,000</span><strong id="remaining">残り ¥90,000</strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="stats"><div class="stat"><small>1日平均</small><strong id="dailyAvg">¥0</strong></div><div class="stat"><small>記録件数</small><strong id="count">0件</strong></div></div></section>

<nav class="tabs"><button class="active" data-tab="record">記録する</button><button data-tab="history">記録一覧</button><button data-tab="analysis">原因分析</button><button data-tab="settings">設定・保存</button></nav>

<section id="history" class="panel card hidden"><h2>📚 記録一覧</h2><div><label for="filterMonth">表示する月</label><input type="month" id="filterMonth"></div><div id="entries"></div></section>
<section id="analysis" class="panel card hidden"><h2>🔎 食費が増えた理由</h2><label for="analysisMonth">分析する月</label><input type="month" id="analysisMonth"><div id="analysisResult" style="margin-top:14px"></div></section>
<section id="settings" class="panel card hidden"><h2>⚙️ 設定・バックアップ</h2><label for="budgetInput">月の食費予算（円）</label><input type="number" min="0" step="1000" id="budgetInput" value="90000"><button class="primary" id="saveBudget">予算を保存</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>データのバックアップ</h2><p class="hint">記録をJSONファイルに書き出せます。機種変更やブラウザのデータ消去に備えて保存してください。</p><button class="secondary" id="exportBtn" style="width:100%;margin-bottom:10px">バックアップを書き出す</button><label for="importFile">バックアップから復元</label><input type="file" id="importFile" accept="application/json"><p class="hint">復元すると現在の記録はバックアップの内容に置き換わります。</p></section>
<footer>食費ログ · まずは記録を続けることから</footer></main>
<script>
(()=>{'use strict';const KEY='shokuhiLog_v1';const reasons=['お腹が空いてつい余分に買った','ストレス、気分転換','暇だから買った','コンビニを利用','仕事で外食','安売りでまとめ買い','米、コーヒーなど日常使用の商品を買った','飲みものを多く買った','アルコール飲料を買った','家であるもので賄った'];let state={budget:90000,entries:[]};const $=id=>document.getElementById(id);const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const monthNow=()=>today().slice(0,7);function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.entries))state={budget:Number(x.budget)||90000,entries:x.entries}}catch(e){} }function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存できませんでした。端末の空き容量やプライベートブラウズ設定をご確認ください。')}}function monthEntries(m){return state.entries.filter(e=>e.date&&e.date.startsWith(m))}function renderSummary(){const m=monthNow(),es=monthEntries(m),sum=es.reduce((a,e)=>a+Number(e.amount),0),days=new Date().getDate();$('monthLabel').textContent=`${Number(m.slice(5))}月の食費`;$('total').textContent=yen(sum);$('budgetText').textContent=`予算 ${yen(state.budget)}`;$('remaining').textContent=sum<=state.budget?`残り ${yen(state.budget-sum)}`:`予算超過 ${yen(sum-state.budget)}`;$('remaining').style.color=sum>state.budget?'#b45309':'var(--green)';$('bar').style.width=Math.min(100,state.budget?sum/state.budget*100:0)+'%';$('bar').style.background=sum>state.budget?'#d97706':'var(--green)';$('dailyAvg').textContent=yen(Math.round(sum/days));$('count').textContent=es.length+'件';$('budgetInput').value=state.budget}function renderEntries(){const m=$('filterMonth').value||monthNow();const es=state.entries.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('entries').innerHTML=es.length?es.map(e=>`<div class="entry"><div class="row"><strong>${esc(e.content||'食費')}</strong><strong>${yen(e.amount)}</strong></div><small>${e.date} ・ ${esc(e.meal||'食事未記録')} ・ 薬：${esc(e.medication||'未記録')}<br>${(e.reasons||[]).map(esc).join('、')||'理由の記録なし'}${e.memo?'<br>'+esc(e.memo):''}</small><div class="actions"><button class="secondary" data-edit="${e.id}">編集</button><button class="danger" data-delete="${e.id}">削除</button></div></div>`).join(''):'<div class="empty">この月の記録はまだありません。</div>'}function renderAnalysis(){const m=$('analysisMonth').value||monthNow(),es=monthEntries(m),sum=es.reduce((a,e)=>a+Number(e.amount),0),map={};es.forEach(e=>(e.reasons||[]).forEach(r=>{map[r]=(map[r]||0)+Number(e.amount)}));const ranked=Object.entries(map).sort((a,b)=>b[1]-a[1]);let html=`<div class="stat" style="margin-bottom:12px"><small>${m.replace('-','年')}月の支出合計</small><strong>${yen(sum)}</strong><small>理由を選んだ記録から傾向を集計します。理由ごとの金額は重複する場合があります。</small></div>`;if(!es.length){html+='<div class="empty">記録が増えると、理由別の傾向がここに表示されます。</div>'}else if(!ranked.length){html+='<div class="empty">この月は理由がまだ記録されていません。支出記録で理由を選ぶと分析できます。</div>'}else{html+='<h3 style="font-size:15px">理由別に関連する支出</h3>'+ranked.map(([r,v])=>`<div style="margin:10px 0"><div class="row"><span>${esc(r)}</span><strong>${yen(v)}</strong></div><div class="progress"><div class="bar" style="width:${sum?Math.min(100,v/sum*100):0}%"></div></div></div>`).join('');const top=ranked[0];html+=`<div class="advice"><strong>💡 節約のヒント</strong><br>最も多く記録された理由は「${esc(top[0])}」です。まずはこの場面で、買う前に一度立ち止まる・買う量を決めておくなど、小さな工夫を試してみましょう。記録を続けると、改善できたか比較できます。</div>`}const overs=es.filter(e=>(e.reasons||[]).some(r=>r.includes('食べすぎ')||r.includes('大盛り'))).length;if(overs)html+=`<p class="hint">食べる量に関係する理由を記録した回数：${overs}件。責めるためではなく、どんなときに増えやすいかを知る目安にしましょう。</p>`;$('analysisResult').innerHTML=html}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function resetForm(){ $('entryForm').reset();$('editId').value='';$('date').value=today();$('formTitle').textContent='📝 食費を記録';$('saveBtn').textContent='記録を保存';$('cancelEdit').classList.add('hidden');document.querySelectorAll('#reasonChoices input').forEach(x=>x.checked=false);document.querySelectorAll('input[name="meal"]').forEach(x=>x.checked=false);document.querySelector('input[name="medication"][value="未記録"]').checked=true}reasons.forEach((r,i)=>{const label=document.createElement('label');label.className='choice';label.innerHTML=`<input type="checkbox" value="${esc(r)}"><span>${esc(r)}</span>`;$('reasonChoices').append(label)});document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('hidden',p.id!==b.dataset.tab));if(b.dataset.tab==='history')renderEntries();if(b.dataset.tab==='analysis')renderAnalysis()}));$('entryForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(!amount||amount<1){alert('金額を入力してください');return}const id=$('editId').value?Number($('editId').value):Date.now();const entry={id,date:$('date').value,amount,meal:document.querySelector('input[name="meal"]:checked')?.value||'',medication:document.querySelector('input[name="medication"]:checked')?.value||'未記録',content:$('content').value.trim(),reasons:[...document.querySelectorAll('#reasonChoices input:checked')].map(x=>x.value),memo:$('memo').value.trim()};const idx=state.entries.findIndex(x=>x.id===id);if(idx>=0)state.entries[idx]=entry;else state.entries.push(entry);persist();resetForm();renderAll();alert('記録を保存しました！')});$('entries').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed){const x=state.entries.find(x=>x.id===Number(ed.dataset.edit));if(!x)return;$('editId').value=x.id;$('date').value=x.date;$('amount').value=x.amount;document.querySelectorAll('input[name="meal"]').forEach(c=>c.checked=c.value===(x.meal||''));document.querySelectorAll('input[name="medication"]').forEach(c=>c.checked=c.value===(x.medication||'未記録'));$('content').value=x.content||'';$('memo').value=x.memo||'';document.querySelectorAll('#reasonChoices input').forEach(c=>c.checked=(x.reasons||[]).includes(c.value));$('formTitle').textContent='✏️ 記録を編集';$('saveBtn').textContent='変更を保存';$('cancelEdit').classList.remove('hidden');document.querySelector('[data-tab="record"]').click();window.scrollTo(0,0)}if(del&&confirm('この記録を削除しますか？')){state.entries=state.entries.filter(x=>x.id!==Number(del.dataset.delete));persist();renderAll()}});$('cancelEdit').addEventListener('click',resetForm);$('budgetBtn').addEventListener('click',()=>{document.querySelector('[data-tab="settings"]').click();$('budgetInput').focus()});$('saveBudget').addEventListener('click',()=>{const n=Number($('budgetInput').value);if(!Number.isFinite(n)||n<0){alert('予算を正しく入力してください');return}state.budget=n;persist();renderAll();alert('予算を保存しました')});$('filterMonth').value=monthNow();$('analysisMonth').value=monthNow();$('filterMonth').addEventListener('change',renderEntries);$('analysisMonth').addEventListener('change',renderAnalysis);$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shokuhi-log-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.entries)||!confirm('現在の記録を置き換えて復元しますか？'))return;state={budget:Number(x.budget)||90000,entries:x.entries};persist();renderAll();alert('バックアップを復元しました')}catch(err){alert('バックアップファイルを読み込めませんでした')}e.target.value=''});function renderAll(){renderSummary();renderEntries();renderAnalysis()}load();$('date').value=today();renderAll();})();
</script></body></html>
